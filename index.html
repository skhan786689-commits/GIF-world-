const cats=["All GIFs",["Hijab GIFs", "Islamic GIFs", "Anime GIFs", "Cute GIFs", "Funny GIFs", "Love & Friendship GIFs", "Attitude GIFs", "Nature GIFs"]].flat();
let selected="All GIFs";
const nav=document.getElementById("cats"),grid=document.getElementById("grid"),search=document.getElementById("search");
function renderCats(){nav.innerHTML="";cats.forEach(c=>{let b=document.createElement("button");b.className="cat"+(c===selected?" active":"");b.textContent=c;b.onclick=()=>{selected=c;render()};nav.appendChild(b)})}
function render(){renderCats();let q=search.value.toLowerCase();let shown=data.filter(x=>(selected==="All GIFs"||x.cat===selected)&&(x.title.toLowerCase().includes(q)||x.cat.toLowerCase().includes(q)));grid.innerHTML="";if(!shown.length){grid.innerHTML='<div class="empty">इस खोज में अभी GIF नहीं मिली।</div>';return}shown.forEach(x=>{let card=document.createElement("article");card.className="card";let img=document.createElement("img");img.src=x.src;img.alt=x.title+" animated GIF";let info=document.createElement("div");info.className="info";let title=document.createElement("div");title.className="title";title.textContent=x.title;let tag=document.createElement("div");tag.className="tag";tag.textContent=x.cat;let actions=document.createElement("div");actions.className="actions";let dl=document.createElement("button");dl.textContent="⬇ Download";dl.onclick=()=>{let a=document.createElement("a");a.href=x.src;a.download=x.title.toLowerCase().replaceAll(" ","-")+".gif";a.click()};let share=document.createElement("button");share.className="secondary";share.textContent="Share";share.onclick=async()=>{try{let blob=await (await fetch(x.src)).blob();let file=new File([blob],x.title+".gif",{type:"image/gif"});if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:x.title});else{await navigator.clipboard.writeText(x.title+" — GIF World");alert("Share feature आपके browser में उपलब्ध नहीं है।")}}catch(e){alert("इस डिवाइस पर शेयर करना उपलब्ध नहीं है।")}};actions.append(dl,share);info.append(title,tag,actions);card.append(img,info);grid.append(card)})}
search.addEventListener("input",render);render();
</script></body></html>
